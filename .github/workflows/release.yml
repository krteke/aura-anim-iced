name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$tag_version" = "$workspace_version"

      - name: Verify tests
        run: cargo test --workspace --all-targets --locked

      - name: Verify Oklaba features
        run: cargo test -p aura-anim-core --all-targets --features iced,oklaba --locked

      - name: Verify tracing features
        run: cargo test -p aura-anim-core --all-targets --features iced,tracing --locked

      - name: Verify packages
        run: cargo package --workspace --locked

      - name: Publish workspace
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --workspace --locked --token "$CARGO_REGISTRY_TOKEN"
