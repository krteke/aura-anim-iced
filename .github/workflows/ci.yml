name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - "1.88"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Check default features
        run: cargo check --workspace --all-targets

      - name: Check RGBA features
        run: cargo check -p aura-anim-core --all-targets --features iced,rgba

      - name: Check Oklaba features
        run: |
          cargo check -p aura-anim-core --all-targets --features iced,oklaba
          cargo check -p aura-anim-iced --all-targets --no-default-features --features oklaba
          cargo check -p aura-anim --all-targets --no-default-features --features oklaba

      - name: Check benchmarks
        run: cargo bench -p aura-anim-core --bench animation --no-run

      - name: Test default features
        run: cargo test --workspace --all-targets

      - name: Test Oklaba features
        run: cargo test -p aura-anim-core --all-targets --features iced,oklaba

      - name: Clippy default features
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy Oklaba features
        run: cargo clippy -p aura-anim-core --all-targets --features iced,oklaba -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Package workspace
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo package --workspace --locked
